name: Update README from README-source

on:
  push:
    paths:
      - 'README-source.md'
      - 'py/make_readme.py'
  workflow_dispatch:      # also allows running it by hand from the Actions tab

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Run make_readme.py
        run: python py/make_readme.py

      - name: Commit and push if README changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README.md from README-source.md" || exit 0
          git push
